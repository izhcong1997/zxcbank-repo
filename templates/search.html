<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ZXC Bank transfer search</title>
  <style>
    body { margin: 0; background: #fff; color: #0b1f3a; font-family: Helvetica, Arial, sans-serif; }
    header { background: #0b1f3a; color: #fff; padding: 28px 32px; }
    main { max-width: 640px; margin: 0 auto; padding: 32px 20px; }
    input { width: 100%; box-sizing: border-box; margin-top: 8px; padding: 10px; border: 1px solid #0b1f3a; }
    button { margin-top: 16px; background: #0b1f3a; color: #fff; border: 0; padding: 12px 18px; }
    li { margin: 8px 0; }
  </style>
</head>
<body>
  <header><h1>Transfer search</h1></header>
  <main>
    <form method="get" action="/transfers/search">
      <label>Filter
        <input name="q" value="{{ query or '' }}">
      </label>
      <button type="submit">Search</button>
    </form>
    <ul>
      {% for row in transfers %}
        <li>{{ row.from_account }} to {{ row.to_account }} · SGD {{ row.amount }} · {{ row.status }}</li>
      {% endfor %}
    </ul>
  </main>
</body>
</html>
